name: Deploy docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Also publish the docs on-chain to docs.dot on the Products Devnet, so the
  # docs are dogfooded through the same delivery path apps use (Bulletin + DotNS).
  # Additive to GitHub Pages. Inert until the repo variable PUBLISH_DOCS_DOT is
  # "true"; the docs.dot name is already reserved and owned by the signer, so this
  # job only refreshes its content.
  #
  # Uses the dotns CLI, not `pad`: pad refuses base names <= 5 chars (governance-
  # reserved), so it cannot publish to a 4-char name like `docs`. We build the
  # on-chain variant (mkdocs.onchain.yml — adds the sandbox navigation shim),
  # upload it to Bulletin, then point docs.dot's content hash at the new CID.
  # DOCS_DOT_SIGNER_MNEMONIC is the name owner (5Fk8), authorized on Bulletin.
  publish-onchain:
    needs: build
    if: ${{ vars.PUBLISH_DOCS_DOT == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build on-chain variant
        run: mkdocs build -f mkdocs.onchain.yml -d site-onchain --strict

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # dotns CLI requires Node >= 20; 22 to be safe

      - name: Install polkadot-app-deploy (pad) and dotns CLI
        # pad publishes the product manifest next to the content: the `manifest`
        # text record (displayName/description/icon) on docs.dot and the
        # `app.docs.dot` executable subname the Polkadot app clients open. A
        # content-only publish would leave that subname stale. dotns-cli is kept
        # for the read-back.
        #
        # Both are installed at @latest, deliberately: these CLIs carry the
        # network presets, contract addresses, and Bulletin authorization
        # decoding inside them, and every past pin here went stale and broke
        # this job (0.8.2 read every account as "not authorized" until 0.9.1).
        # Pin a version here only to work around a bad release.
        run: |
          npm i -g @polkadot-community-foundation/polkadot-app-deploy@latest \
                   @polkadot-community-foundation/dotns-cli@latest

      - name: Publish to docs.dot on the Products Devnet
        env:
          DOTNS_MNEMONIC: ${{ secrets.DOCS_DOT_SIGNER_MNEMONIC }}
        run: |
          set -euo pipefail
          # `--mnemonic` must be a FLAG: it selects pad's direct-signer mode, so
          # the authorized name owner (5Fk8) signs its own Bulletin uploads
          # instead of the unauthorized //deploy/N pool. The value is a masked
          # secret; pad's "puts a secret on the command line" warning is expected.
          # `--js-merkle`: no Kubo binary on the runner. Config discovered from
          # polkadot-app-deploy.config.ts at the repo root.
          polkadot-app-deploy ./site-onchain docs.dot --env devnet --mnemonic "$DOTNS_MNEMONIC" --js-merkle \
            | grep -v -- "puts a secret on the command line"
          echo "Read-back…"
          dotns lookup --name docs --env devnet
          dotns text view app.docs executable --env devnet
