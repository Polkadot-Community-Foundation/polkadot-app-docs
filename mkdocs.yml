# Polkadot App Docs — MkDocs Material configuration.
# The visual identity lives in material-overrides/assets/stylesheets/ and mirrors
# the Polkadot app clients: tokens.css is GENERATED from the app design system
# (tools/build-design-tokens.mjs) and carries the four named themes (berlin /
# tokyo / malta / lisbon, light + dark); chrome / content / components / diagrams
# style the site with those tokens only. Content pages stay plain Markdown.

site_name: Polkadot App Docs
site_description: >-
  Developer and user documentation for the Polkadot Products Devnet and the
  Polkadot app — architecture, guides, and reference.
site_url: https://docs.polkadotcommunity.foundation/
copyright: © Polkadot Community Foundation
docs_dir: docs

# Repo edit links (adjust once the repo is pushed).
repo_url: https://github.com/Polkadot-Community-Foundation/polkadot-app-docs
repo_name: polkadot-app-docs
edit_uri: edit/main/docs/

# Load order matters: fonts, then tokens, then the layers that consume them.
extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/tokens.css
  - assets/stylesheets/chrome.css
  - assets/stylesheets/content.css
  - assets/stylesheets/components.css
  - assets/stylesheets/diagrams.css

# mermaid-zoom.js: click-to-zoom lightbox for the Mermaid diagrams (no CDN).
# theme-picker.js: the header theme picker (berlin / tokyo / malta / lisbon).
extra_javascript:
  - assets/javascripts/mermaid-zoom.js
  - assets/javascripts/theme-picker.js

validation:
  absolute_links: ignore
  unrecognized_links: ignore
  omitted_files: ignore

exclude_docs: |
  AGENTS.md
  README.md
  AUTHORING-diagrams.md
  _snippets/

theme:
  name: material
  custom_dir: material-overrides
  favicon: assets/images/polkadot.png
  logo: assets/images/polkadot.png
  font: false # Inter / Manrope / Martian Mono are self-hosted (fonts.css); no Google Fonts CDN.
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.footer # prev/next links, so a page does not end at the article panel
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
  # Like the app: first visit follows the OS light/dark preference (the media
  # queries), the toggle overrides it. Light is listed first so the pre-JS
  # body attribute defaults to light. The named theme (berlin / tokyo / malta /
  # lisbon) is orthogonal and handled by the header theme picker.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: polkadot-light
      toggle:
        icon: octicons/moon-24
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: polkadot-dark
      toggle:
        icon: octicons/sun-24
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      title: On this page
      permalink: false
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  # Single-source blocks live in docs/_snippets/ and are pulled in with `--8<--`.
  # Facts that appear on more than one page belong there, not in a second copy.
  - pymdownx.snippets:
      base_path:
        - docs/_snippets
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        # Authors still write ```mermaid fences, but we emit class `dg-mermaid`
        # (NOT `mermaid`) so Material's built-in — and flaky — Mermaid typeset
        # ignores them. mermaid-zoom.js renders them itself, reliably, and wires
        # the zoom lightbox. See that file for the why.
        - name: mermaid
          class: dg-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  # No `social:` block on purpose. The header already carries a GitHub link (to
  # this repo, via repo_url); a second one in the footer pointing at a different
  # org is noise. Source links for individual projects live in
  # docs/reference/resources.md.
  generator: false

nav:
  - Home: index.md
  # "Get started" blends the platform introduction with the two entry paths
  # (users, developers) under one section (clicking the tab lands on the
  # Introduction). introduction.md must appear ONCE in the nav — listing it here
  # AND as a top-level tab put it in the sidebar twice.
  - Get started:
      - Introduction: introduction.md
      - For users: getting-started/users.md
      - Developer quickstart: getting-started/developers.md
  - Guides:
      - guides/index.md
      - For users:
          - Create an account & get funds: guides/create-account.md
          - Back up & restore your account: guides/back-up-your-account.md
          - Get & use CASH: guides/get-and-use-cash.md
          - Messaging & calls: guides/messaging-and-calls.md
          - Username & proof of personhood: guides/username-and-personhood.md
          - Discover & open apps: guides/discover-and-open-apps.md
      - For developers:
          - Build & Publish Applications: guides/build-and-publish.md
          - Register a .dot domain: guides/register-a-dot-name.md
          - Deploy & register contracts: guides/deploy-contracts-cdm.md
          - Use platform services from the SDK: guides/platform-services-sdk.md
          - List your app in Browse: guides/list-in-browse.md
  - Architecture:
      - architecture/index.md
      - The network: architecture/network.md
      - The Polkadot app (client tier): architecture/client.md
      - Naming (DotNS): architecture/naming.md
      - App delivery: architecture/app-delivery.md
      - Storage & data: architecture/storage.md
      - Smart contracts & CDM: architecture/contracts.md
      - Identity & personhood: architecture/identity.md
      - Money (CASH & funding): architecture/money.md
      - App discovery (Browse): architecture/discovery.md
      - Messaging & calls: architecture/messaging.md
  - Reference:
      - reference/index.md
      - Networks & endpoints: reference/networks.md
      - Packages & tools: reference/packages.md
      - Addresses & registries: reference/addresses.md
      - Glossary: reference/glossary.md
      - More resources: reference/resources.md
  # Release notes + breaking changes. One page per update, newest first in
  # updates/index.md; the date in the filename is the identity of the entry.
  - Updates:
      - updates/index.md
      - "Devnet update: new apps, X25519 chat, new registries": updates/2026-09-devnet-update.md
